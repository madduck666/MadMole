name: App

# Builds MadMole.app (the native Apple Silicon front end). Every push also
# publishes a GitHub release tagged madmole-<run number>, which the app's
# "check for updates" reads and installs over itself.
on:
  push:
    paths:
      - 'app/**'
      - 'cmd/**'
      - 'bin/**'
      - 'lib/**'
      - 'mole'
      - 'scripts/build_app.sh'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/build_app.sh'
      - '.github/workflows/app.yml'
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: Commit the page screenshots to app/screenshots on this branch
        type: boolean
        default: false
      ui_test_release:
        description: Also run the UI test against a published release tag (for example madmole-9)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MadMole.app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Analyze trash mode tests
        run: go test ./cmd/analyze -run 'TrashMode|ParseArgs'

      - name: Load the signing certificate
        id: signing
        env:
          # A self-signed code-signing certificate (PKCS#12, base64). With it
          # every build has the same designated requirement, so macOS keeps
          # the app's privacy permissions across updates. Without it the build
          # falls back to an ad-hoc signature.
          SIGNING_P12: ${{ secrets.MADMOLE_SIGNING_P12 }}
        run: |
          if [[ -z "$SIGNING_P12" ]]; then
            echo "::warning::MADMOLE_SIGNING_P12 is not set; signing ad hoc, so macOS drops permissions on every update"
            exit 0
          fi
          keychain="$RUNNER_TEMP/madmole-signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P madmole -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys -passin pass:madmole -out "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem" || true
          rm -f "$RUNNER_TEMP/signing.p12"
          hash=$(security find-certificate -c "MadMole Code Signing" -Z "$keychain" | awk '/SHA-1/ {print $3}')
          [[ -n "$hash" ]] || { echo "::error::No 'MadMole Code Signing' certificate in MADMOLE_SIGNING_P12"; exit 1; }
          echo "identity=$hash" >> "$GITHUB_OUTPUT"

      - name: Build app, DMG and update zip
        env:
          MADMOLE_SIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
          MADMOLE_VERSION: 1.0.${{ github.run_number }}
          MADMOLE_BUILD: ${{ github.run_number }}
          MADMOLE_UPDATE_REPO: ${{ github.repository }}
        run: ./scripts/build_app.sh --dmg --zip

      - name: Smoke test the bundled engine
        run: |
          APP="app/.build/MadMole.app"
          ENGINE="$APP/Contents/Resources/engine"
          file "$APP/Contents/MacOS/MadMole"
          "$ENGINE/mole" --version
          "$ENGINE/bin/status-go" --json > /tmp/status.json
          python3 -c "import json; d=json.load(open('/tmp/status.json')); print('health', d['health_score'])"
          "$ENGINE/bin/analyze-go" --json "$ENGINE/lib" > /tmp/analyze.json
          python3 -c "import json; d=json.load(open('/tmp/analyze.json')); print('entries', len(d['entries']))"
          "$ENGINE/mole" history --json --limit 5 > /tmp/history.json
          python3 -c "import json; json.load(open('/tmp/history.json')); print('history ok')"
          codesign --verify --strict --verbose=2 "$APP"
          # Without this key macOS refuses Finder automation from the app
          # silently, and uninstall cannot reach Finder's Trash fallback.
          /usr/libexec/PlistBuddy -c "Print :NSAppleEventsUsageDescription" "$APP/Contents/Info.plist"
          requirement=$(codesign -d -r- "$APP" 2>&1 | grep '^designated' || true)
          echo "$requirement"
          if [[ -n "${{ steps.signing.outputs.identity }}" && "$requirement" != *"certificate"* ]]; then
            echo "::error::A signing certificate was loaded but the app is not signed with it"
            exit 1
          fi

      - name: UI test, click every sidebar page
        run: |
          mkdir -p ui-shots
          swiftc -O -o "$RUNNER_TEMP/ui_smoke" app/Tests/ui_smoke.swift
          status=0
          "$RUNNER_TEMP/ui_smoke" app/.build/MadMole.app ui-shots || status=$?
          if [[ "$status" -eq 3 ]]; then
            # Grant Accessibility and synthetic-event access to the test and
            # to every process above it (TCC asks the responsible process).
            # The hosted runners run with SIP disabled, so the system TCC
            # database is writable with sudo.
            db="/Library/Application Support/com.apple.TCC/TCC.db"
            clients=("$RUNNER_TEMP/ui_smoke" /bin/bash)
            pid=$$
            while [[ "$pid" -gt 1 ]]; do
              exe=$(ps -o comm= -p "$pid" 2> /dev/null || true)
              [[ "$exe" == /* ]] && clients+=("$exe")
              pid=$(ps -o ppid= -p "$pid" 2> /dev/null | tr -d ' ' || echo 1)
              [[ -n "$pid" ]] || pid=1
            done
            now=$(date +%s)
            for client in "${clients[@]}"; do
              for service in kTCCServiceAccessibility kTCCServicePostEvent; do
                echo "grant $service to $client"
                sudo sqlite3 "$db" "INSERT OR REPLACE INTO access VALUES('$service','$client',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',0);" || true
              done
            done
            status=0
            "$RUNNER_TEMP/ui_smoke" app/.build/MadMole.app ui-shots || status=$?
          fi
          if [[ "$status" -eq 3 ]]; then
            echo "::warning::UI test skipped, Accessibility permission unavailable on this runner"
            exit 0
          fi
          exit "$status"

      - name: UI test a published release
        if: inputs.ui_test_release != ''
        continue-on-error: true
        env:
          TAG: ${{ inputs.ui_test_release }}
        run: |
          old="$RUNNER_TEMP/release-under-test"
          mkdir -p "$old"
          curl -fsSL -o "$old/MadMole.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MadMole.zip"
          ditto -x -k "$old/MadMole.zip" "$old"
          "$RUNNER_TEMP/ui_smoke" "$old/MadMole.app"

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MadMole-ui-test
          path: ui-shots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Self-update from the newest published release
        env:
          # The shared runner IP exhausts GitHub's anonymous API limit; the app
          # reads MADMOLE_GITHUB_TOKEN only for this test.
          GH_TOKEN: ${{ github.token }}
          MADMOLE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" |
            python3 -c "import sys,json; b=[int(r['tag_name'][8:]) for r in json.load(sys.stdin) if r['tag_name'].startswith('madmole-') and not r['draft']]; print(max(b) if b else '')")
          if [[ -z "$latest" ]]; then
            echo "No madmole-* release yet; nothing to update from."
            exit 0
          fi
          apps="$RUNNER_TEMP/Apps"
          mkdir -p "$apps"
          copy="$apps/MadMole.app"
          ditto app/.build/MadMole.app "$copy"
          # Pretend to be an old install: build 0, re-signed after the edit.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 0" "$copy/Contents/Info.plist"
          codesign --force --sign - --timestamp=none "$copy"
          MADMOLE_UPDATE_SELFTEST=1 "$copy/Contents/MacOS/MadMole" > "$RUNNER_TEMP/selftest.log" 2>&1 &
          for _ in $(seq 1 90); do
            build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$copy/Contents/Info.plist" 2> /dev/null || echo "")
            [[ "$build" == "$latest" ]] && break
            sleep 2
          done
          pkill -x MadMole || true
          cat "$RUNNER_TEMP/selftest.log" || true
          echo "Installed build after update: ${build:-none} (expected $latest)"
          [[ "$build" == "$latest" ]]
          codesign --verify --deep --strict "$copy"
          [[ ! -e "$apps/MadMole.previous.app" ]]

      - name: Screenshot every page
        continue-on-error: true
        run: |
          APP_BIN="app/.build/MadMole.app/Contents/MacOS/MadMole"
          mkdir -p screenshots
          shoot() {
            local name="$1" page="$2" wait_s="$3"
            MADMOLE_START_PAGE="$page" MADMOLE_AUTORUN=1 "$APP_BIN" > "screenshots/$name.log" 2>&1 &
            local pid=$!
            sleep "$wait_s"
            screencapture -x "screenshots/$name.png" || echo "screencapture failed for $name"
            kill "$pid" 2> /dev/null || true
            wait "$pid" 2> /dev/null || true
          }
          shoot 1-dashboard dashboard 15
          shoot 2-clean clean 120
          shoot 3-uninstall uninstall 60
          shoot 4-analyze analyze 60
          shoot 5-optimize optimize 45
          shoot 6-purge purge 30
          shoot 7-history history 15
          shoot 8-settings settings 10
          defaults delete com.madduck666.madmole appearance 2> /dev/null || true
          export MADMOLE_APPEARANCE=dark
          shoot 9-dashboard-dark dashboard 15
          shoot 10-clean-dark clean 120
          shoot 11-analyze-dark analyze 60
          unset MADMOLE_APPEARANCE
          defaults delete com.madduck666.madmole appearance 2> /dev/null || true
          for png in screenshots/*.png; do sips -Z 1280 "$png" > /dev/null || true; done
          ls -l screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MadMole-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload DMG and update zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MadMole-dist
          path: |
            dist/MadMole.dmg
            dist/MadMole.zip
            dist/MadMole.zip.sha256
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: madmole-release
      cancel-in-progress: false

    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MadMole-dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="madmole-${GITHUB_RUN_NUMBER}"
          version="1.0.${GITHUB_RUN_NUMBER}"
          printf '%s\n' "${COMMIT_MESSAGE:-MadMole $version}" > notes.md
          # --latest=false keeps the repository's "latest release" on the CLI's V tags.
          gh release create "$tag" dist/MadMole.zip dist/MadMole.zip.sha256 dist/MadMole.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MadMole $version" \
            --notes-file notes.md \
            --latest=false

      - name: Keep the ten newest app releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("madmole-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done

  publish-screenshots:
    name: Publish screenshots
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Download screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MadMole-screenshots
          path: app/screenshots

      - name: Commit screenshots
        run: |
          find app/screenshots -name '*.log' -type f -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "docs(app): refresh page screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
