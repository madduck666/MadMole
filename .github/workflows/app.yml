name: App

# Builds MadMole.app (the native Apple Silicon front end) and publishes a DMG
# as a workflow artifact.
on:
  push:
    paths:
      - 'app/**'
      - 'cmd/**'
      - 'bin/**'
      - 'lib/**'
      - 'mole'
      - 'scripts/build_app.sh'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/build_app.sh'
      - '.github/workflows/app.yml'
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: Commit the page screenshots to app/screenshots on this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MadMole.app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Analyze trash mode tests
        run: go test ./cmd/analyze -run 'TrashMode|ParseArgs'

      - name: Build app and DMG
        run: ./scripts/build_app.sh --dmg

      - name: Smoke test the bundled engine
        run: |
          APP="app/.build/MadMole.app"
          ENGINE="$APP/Contents/Resources/engine"
          file "$APP/Contents/MacOS/MadMole"
          "$ENGINE/mole" --version
          "$ENGINE/bin/status-go" --json > /tmp/status.json
          python3 -c "import json; d=json.load(open('/tmp/status.json')); print('health', d['health_score'])"
          "$ENGINE/bin/analyze-go" --json "$ENGINE/lib" > /tmp/analyze.json
          python3 -c "import json; d=json.load(open('/tmp/analyze.json')); print('entries', len(d['entries']))"
          "$ENGINE/mole" history --json --limit 5 > /tmp/history.json
          python3 -c "import json; json.load(open('/tmp/history.json')); print('history ok')"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Screenshot every page
        continue-on-error: true
        run: |
          APP_BIN="app/.build/MadMole.app/Contents/MacOS/MadMole"
          mkdir -p screenshots
          shoot() {
            local name="$1" page="$2" wait_s="$3"
            MADMOLE_START_PAGE="$page" MADMOLE_AUTORUN=1 "$APP_BIN" > "screenshots/$name.log" 2>&1 &
            local pid=$!
            sleep "$wait_s"
            screencapture -x "screenshots/$name.png" || echo "screencapture failed for $name"
            kill "$pid" 2> /dev/null || true
            wait "$pid" 2> /dev/null || true
          }
          shoot 1-dashboard dashboard 15
          shoot 2-clean clean 120
          shoot 3-uninstall uninstall 60
          shoot 4-analyze analyze 60
          shoot 5-optimize optimize 45
          shoot 6-purge purge 30
          shoot 7-history history 15
          shoot 8-settings settings 10
          defaults write -g AppleInterfaceStyle Dark
          shoot 9-dashboard-dark dashboard 15
          shoot 10-clean-dark clean 120
          defaults delete -g AppleInterfaceStyle || true
          for png in screenshots/*.png; do sips -Z 1600 "$png" > /dev/null || true; done
          ls -l screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MadMole-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MadMole-dmg
          path: dist/MadMole.dmg
          retention-days: 30

  publish-screenshots:
    name: Publish screenshots
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Download screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MadMole-screenshots
          path: app/screenshots

      - name: Commit screenshots
        run: |
          find app/screenshots -name '*.log' -type f -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "docs(app): refresh page screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
